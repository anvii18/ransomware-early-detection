name: Project checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ransomware_ml/ransomware_ml1/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ransomware_ml/ransomware_ml1/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Import API app
        run: python -c 'from backend.app import app; print(app.title)'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Train model smoke test
        run: python ransomware_ml/ransomware_ml1/modeltrain.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
